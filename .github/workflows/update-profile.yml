name: Refresh STARBLOOD.OS profile metrics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-profile.yml'
      - 'scripts/collect_stats.py'
      - 'scripts/render_assets.py'
      - 'tests/**'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *' # GitHub Actions schedules use UTC; delays are possible

permissions:
  contents: read

concurrency:
  group: starblood-profile-stats
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write # Required only by this job's final generated-file commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
          ref: ${{ github.event.repository.default_branch }}

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Run offline regression tests before collecting or committing
        run: python -m unittest discover -s tests -v

      - name: Query public GitHub profile statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect_stats.py --username Starblood24 --output data/stats.json

      - name: Render custom SVGs
        run: python scripts/render_assets.py --data data/stats.json --out assets

      - name: Commit generated data (only when changed)
        run: |
          git add data/stats.json assets/stats.svg assets/contributions.svg assets/languages.svg assets/stats_mobile.svg assets/contributions_mobile.svg assets/languages_mobile.svg
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh public profile graphics"
          git push
